name = "lean-xmss-security"
version = "0.1.0"
defaultTargets = ["LeanXmss", "XmssSecurity", "XmssSecurity.Tests.QueryBudget"]

# The random-permutation model and the ROM-to-RPM transfer for Keccak-256.
[[require]]
name = "lean-rpm"
path = "../lean_rpm"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "afa6593f15e1e79ecb3cf22fc56191cecb452bb0"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

[[lean_lib]]
name = "LeanXmss"

[[lean_lib]]
name = "XmssSecurity"
