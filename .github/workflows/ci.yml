name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up and build Lean project
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          # Plain `lake build`: no `--wfail`, so Lake's caches stay enabled and CompPoly's
          # release lookup, which warns at its untagged pin, cannot fail the build.
          # See docs/dependencies.md.
          test: true
          lint: false
          # Restore `.lake` from the Actions cache and fetch Mathlib's oleans with
          # `lake exe cache get`; without them the job compiles Mathlib from source.
          use-github-cache: true
          use-mathlib-cache: auto
          # Kernel-level audit: no declaration under `LeanerVM` may depend on an
          # axiom outside `propext`, `Classical.choice`, `Quot.sound`.
          axiom-audit: true
          axiom-audit-root: LeanerVM
      - name: Elaborate the test root with warnings as errors
        run: lake env lean -E warning tests/Main.lean
