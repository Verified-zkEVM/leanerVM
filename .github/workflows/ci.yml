name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up and build Lean project
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          # `--no-cache`: CompPoly sets `preferReleaseBuild`, and its pin is an untagged
          # commit, so Lake's release lookup warns and `--wfail` would fail the build.
          # See docs/dependencies.md.
          build-args: "--wfail --no-cache"
          test: true
          lint: false
          use-github-cache: true
          use-mathlib-cache: false
          # Kernel-level audit: no declaration under `LeanerVM` may depend on an
          # axiom outside `propext`, `Classical.choice`, `Quot.sound`.
          axiom-audit: true
          axiom-audit-root: LeanerVM
      - name: Elaborate the test root with warnings as errors
        run: lake env lean -E warning tests/Main.lean
