name: Lean

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The statement: definitions and end statements only (`Statement/`), what every other job proves.
  statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake Statement | grep -vE ':[0-9]+: *(--|/-)'
      # The statement imports Mathlib, VCVio, CompPoly and itself, nothing of the proofs.
      - name: Keep the statement apart from the proofs
        run: |
          ! grep -rnE '^(public )?(meta )?import ' --include='*.lean' --exclude-dir=.lake Statement \
              | grep -vE ':[0-9]+:(public )?(meta )?import (Mathlib|VCVio|CompPoly|Statement)\.'
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Statement/.lake
            !Statement/.lake/packages/mathlib/.lake
          key: lake-statement-${{ runner.os }}-${{ hashFiles('Statement/lean-toolchain', 'Statement/lake-manifest.json') }}-${{ hashFiles('Statement/**/*.lean') }}
          restore-keys: lake-statement-${{ runner.os }}-${{ hashFiles('Statement/lean-toolchain', 'Statement/lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Statement
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      # The generated guest data's modules are heavy: `lake-build.py` admits them by memory. Fails on
      # any warning.
      - name: Build
        working-directory: Statement
        run: python3 -I ../lake-build.py .
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Statement/.lake
            !Statement/.lake/packages/mathlib/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake common | grep -vE ':[0-9]+: *(--|/-)'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: common
      - name: Forbid deprecated API
        working-directory: common
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -E '^warning: Common.*has been deprecated' "$RUNNER_TEMP/build.log"
      - name: Check the axiom footprint
        working-directory: common
        run: |
          theorems="Common.indifferentiability Common.transfer Common.transfer2 Common.keccak256_indifferentiable Common.keccak256_transfer Common.keccak256_transfer2 Common.SufCma.rpm_le_rom Common.SufCma.rpm_bound Common.SufCma.rpm_bound_perm Common.Duplex.duplex_le Common.Duplex.duplex_ge"
          { echo 'import Common'; for t in $theorems; do echo "#print axioms $t"; done; } > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          for t in $theorems; do
            grep -qF "'$t' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/axioms.txt"
          done

  lean-xmss-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap first pass: the axiom guard in `XmssSecurity.lean` catches a `sorry`
      # or a `native_decide` reaching the root theorem, this catches one parked
      # anywhere in the project.
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake lean_xmss | grep -vE ':[0-9]+: *(--|/-)'
      # Installs the toolchain from `lean_xmss/lean-toolchain`, fetches the
      # mathlib cache, and runs `lake build` on the default targets, which
      # elaborate the root module and with it the `#guard_msgs` check. The
      # checked-in manifest is used as is: no `lake update`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_xmss
      # Lake replays a cached module's warnings, so a second build lists every one.
      - name: Forbid deprecated API
        working-directory: lean_xmss
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -E '^warning: (LeanXmss|XmssSecurity).*has been deprecated' "$RUNNER_TEMP/build.log"
      # The root module guards its own footprint with `#guard_msgs`, which an
      # edit to the expected message would silence. This asks again from
      # outside, against the list written here.
      - name: Check the axiom footprint
        working-directory: lean_xmss
        run: |
          theorems="leanXmss_has_127_bits_of_classical_security leanXmss_rpm_security leanXmss_rpm_security_calls"
          { echo 'import XmssSecurity'; for t in $theorems; do echo "#print axioms XmssSecurity.$t"; done; } \
            > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          for t in $theorems; do
            grep -qF "'XmssSecurity.$t' depends on axioms: [propext, Classical.choice, Quot.sound]" \
              "$RUNNER_TEMP/axioms.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lean-xmss-axioms
          path: ${{ runner.temp }}/axioms.txt

  lean-sphincs-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake lean_sphincs | grep -vE ':[0-9]+: *(--|/-)'
      # Without Mathlib's build, which `lake exe cache get` fetches, an entry takes
      # a small share of the repository's cache. Only `main` saves one; every
      # branch restores it, and GitHub drops it after a week unused.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lean_sphincs/.lake
            !lean_sphincs/.lake/packages/mathlib/.lake
            common/.lake/build
            Statement/.lake/build
          key: lake-lean-sphincs-${{ runner.os }}-${{ hashFiles('lean_sphincs/lean-toolchain', 'lean_sphincs/lake-manifest.json') }}-${{ hashFiles('lean_sphincs/**/*.lean', 'common/**/*.lean', 'Statement/**/*.lean') }}
          restore-keys: lake-lean-sphincs-${{ runner.os }}-${{ hashFiles('lean_sphincs/lean-toolchain', 'lean_sphincs/lake-manifest.json') }}-
      # Each kernel-checked table (`decide +kernel`) is built alone, before Lake
      # builds the rest in parallel. The largest needs more than the runner's
      # memory, so the swap goes on the runner's scratch disk, which has room.
      - name: Add swap
        run: |
          dir=/mnt; [ -d /mnt ] || dir=/
          sudo fallocate -l 16G "$dir/swapfile.lean"
          sudo chmod 600 "$dir/swapfile.lean"
          sudo mkswap "$dir/swapfile.lean"
          sudo swapon "$dir/swapfile.lean"
          free -g
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_sphincs
          use-github-cache: false
          build: false
      - name: Build the kernel tables one at a time
        working-directory: lean_sphincs
        run: |
          for m in Sphincs.H0FTab Sphincs.H0PTab Sphincs.H0NTab Sphincs.LifetimeCertificates; do
            lake build "$m"
          done
      - name: Build
        working-directory: lean_sphincs
        run: lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Forbid deprecated API
        run: "! grep -E '^warning: Sphincs(Fors|Base)?/.*has been deprecated' \"$RUNNER_TEMP/build.log\""
      - name: Check the axiom footprint
        working-directory: lean_sphincs
        run: |
          theorems="Sphincs.Lifetimes.requestedSecurity Sphincs.Lifetimes.requestedSecurityRpm Sphincs.Lifetimes.requestedSecurityRpmCalls"
          { echo 'import Sphincs'; for t in $theorems; do echo "#print axioms $t"; done; } > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          for t in $theorems; do
            grep -qF "'$t' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/axioms.txt"
          done
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lean_sphincs/.lake
            !lean_sphincs/.lake/packages/mathlib/.lake
            common/.lake/build
            Statement/.lake/build
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: lean-sphincs-axioms
          path: ${{ runner.temp }}/axioms.txt

  lean-da-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake lean_da | grep -vE ':[0-9]+: *(--|/-)'
      # As for sphincs: VCVio and CompPoly build from source, so `main` saves the Lake build,
      # without Mathlib's, which `lake exe cache get` fetches.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lean_da/.lake
            !lean_da/.lake/packages/mathlib/.lake
            common/.lake/build
            Statement/.lake/build
          key: lake-lean-da-${{ runner.os }}-${{ hashFiles('lean_da/lean-toolchain', 'lean_da/lake-manifest.json') }}-${{ hashFiles('lean_da/**/*.lean', 'common/**/*.lean', 'Statement/**/*.lean') }}
          restore-keys: lake-lean-da-${{ runner.os }}-${{ hashFiles('lean_da/lean-toolchain', 'lean_da/lake-manifest.json') }}-
      # Builds the default target, whose root module checks the front-page theorems' axioms with
      # `#guard_msgs`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_da
          use-github-cache: false
      # Lake replays a cached module's warnings, so a second build lists every one.
      - name: Forbid deprecated API
        working-directory: lean_da
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -E '^warning: (LeanDa|PqDas).*has been deprecated' "$RUNNER_TEMP/build.log"
      # LeanDA's security is Benedikt Wagner's framework, theorems and proofs
      # (b-wagn/fv-pq-da), ported and instantiated with LeanDA.
      - name: Check the axiom footprint
        working-directory: lean_da
        run: |
          theorems="LeanDa.leanDa_perfectlyComplete_rpm LeanDa.leanDa_positionBinding LeanDa.leanDa_codeBinding LeanDa.checker_sound LeanDa.commitCodewords_eq_commitCells LeanDa.dualCodeword_eq_dual LeanDa.membershipVector_eq_dual LeanDa.leanDa_positionBinding_rpm LeanDa.leanDa_codeBinding_rpm LeanDa.leanDa_codeBinding_rpm_bound"
          { echo 'import LeanDa'; for t in $theorems; do echo "#print axioms $t"; done; } > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          for t in $theorems; do
            grep -qF "'$t' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/axioms.txt"
          done
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lean_da/.lake
            !lean_da/.lake/packages/mathlib/.lake
            common/.lake/build
            Statement/.lake/build
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: lean-da-axioms
          path: ${{ runner.temp }}/axioms.txt

  # `lean_vm` models the verifier and the prover's proofs of the leanVM commit in
  # `leanvm-rev`, and imports the statement (`Statement/`), what is left of the two signature
  # schemes' and LeanDA's Scheme modules, and `common`, so a change to any of them re-checks it. A skipped job counts as
  # passed for branch protection.
  lean-vm-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || ! git fetch --quiet --depth=1 origin "$BASE"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          # `LeanVM.lean` proves `Statement.Theorems` with the other projects' end theorems, so it
          # builds all of them.
          elif git diff --name-only "$BASE" HEAD -- lean_vm leanvm-rev leanvm-tree.sh lake-build.py common Statement \
              lean_xmss lean_sphincs lean_da .github/workflows/lean.yml | grep -q .; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  lean-vm-formalization:
    needs: lean-vm-changes
    if: needs.lean-vm-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # A build from a cold cache is several CPU-hours of kernel checks, on the runner's cores.
    timeout-minutes: 360
    defaults:
      run:
        working-directory: lean_vm
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake . | grep -vE ':[0-9]+: *(--|/-)'
      # As for sphincs: only `main` saves, without Mathlib's build, which `lake exe cache get` fetches.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lean_vm/.lake
            !lean_vm/.lake/packages/mathlib/.lake
            common/.lake/build
            Statement/.lake/build
            lean_xmss/.lake/build
            lean_sphincs/.lake/build
            lean_da/.lake/build
          key: lake-lean-vm-${{ runner.os }}-${{ hashFiles('lean_vm/lean-toolchain', 'lean_vm/lake-manifest.json') }}-${{ hashFiles('lean_vm/**/*.lean', 'common/**/*.lean', 'Statement/**/*.lean', 'lean_xmss/**/*.lean', 'lean_sphincs/**/*.lean', 'lean_da/**/*.lean') }}
          restore-keys: lake-lean-vm-${{ runner.os }}-${{ hashFiles('lean_vm/lean-toolchain', 'lean_vm/lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_vm
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      # The tests' build exceeds the runner's memory at its peak, and so does a module that runs
      # beside a heavy one; the swap goes on the runner's scratch disk.
      - name: Add swap
        run: |
          dir=/mnt; [ -d /mnt ] || dir=/
          sudo fallocate -l 16G "$dir/swapfile.lean"
          sudo chmod 600 "$dir/swapfile.lean"
          sudo mkswap "$dir/swapfile.lean"
          sudo swapon "$dir/swapfile.lean"
          free -g
      # `lake build` fails on any warning (`warningAsError`) and on an axiom footprint beyond
      # Lean's three (`LeanVM.lean`'s `#guard_msgs`). Lake has no job limit, and its parallel build
      # of the generated kernel-checked families exceeds the runner's memory, so `lake-build.py`
      # runs the one `lake build` with the modules admitted by their recorded memory, those of the
      # statement package (`Statement/`, its guest data as heavy) and the other dependencies included.
      - name: Build
        run: python3 -I ../lake-build.py . LeanVM LeanVMTests
      - name: Test
        run: lake test
      # What is slow in the interpreter: the guest's Fiat-Shamir IV against the Rust's, the DA
      # vector digests.
      - name: The Rust vectors' costly checks
        run: |
          lake build node-vectors
          .lake/build/bin/node-vectors
      - name: The guest's core IR data is current
        run: lake exe guest-core --check
      - name: The guest's certificates are current
        run: lake exe guest-cert --check
      - name: The guest's memory-layer checks are current
        run: lake exe guest-memory --check
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lean_vm/.lake
            !lean_vm/.lake/packages/mathlib/.lake
            common/.lake/build
            Statement/.lake/build
            lean_xmss/.lake/build
            lean_sphincs/.lake/build
            lean_da/.lake/build
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@stable
      # leanVM at `leanvm-rev`, in `.leanvm`, with its `formal/lean_vm` a link to this `lean_vm`.
      - name: Check out leanVM at the pin
        run: ../leanvm-tree.sh
      # The guest's bytecode, source, manifest, test programs and node vectors are what
      # `scripts/guest-export` writes from leanVM's sources at the pin.
      - name: The guest's data is leanVM's
        run: |
          cargo build --release --manifest-path scripts/guest-export/Cargo.toml
          scripts/guest-export/target/release/guest-export . --check
      # Four real Rust aggregations (a leaf, a leaf of both schemes with a blob, a long leanXMSS
      # list, a node over them): the witness holds the statement, the honest hint generator gives
      # the Rust's installed streams entry for entry, and the interpreter runs `main` on them.
      - name: The honest hints are the Rust's (guest-diff)
        run: |
          LEANVM_GUEST_DIFF="$RUNNER_TEMP/guest-diff" cargo test --release \
            --manifest-path scripts/guest-export/Cargo.toml --lib guest_diff -- --ignored
          lake build guest-diff
          .lake/build/bin/guest-diff "$RUNNER_TEMP"/guest-diff/*.txt
      # The Lean verifier and the pinned Rust verifier must agree on the committed proofs and on
      # mutations of them, so a bump to a protocol change fails here until the Lean one follows.
      - name: Rust-vs-Lean differential
        run: |
          lake build leanvm-verify
          cargo build --release --manifest-path scripts/rust-verifier-cli/Cargo.toml
          python3 -I scripts/fuzz-verifier.py tests/fixtures/verifier --jobs 4
      # The statement's honest prover (`LeanVM.Prover.prove`), compiled, on an execution the Rust
      # interpreter runs: its proof must be accepted by the Lean and the Rust verifier, and every
      # mutation of it rejected by both.
      - name: The statement's prover against both verifiers (prover-diff)
        run: |
          scripts/export-prover-traces-rust.sh "$RUNNER_TEMP/prover-cases" > /dev/null
          lake build leanvm-prove
          python3 -I scripts/prover-diff.py "$RUNNER_TEMP/prover-cases" chain4-rate1 --mutations 40 --jobs 4
