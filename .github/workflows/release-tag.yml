name: Lean release tag

on:
  push:
    branches: [main]
    paths:
      - lean-toolchain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Update Lean release tag
        uses: leanprover-community/lean-release-tag@v4.18804.0
        with:
          do-release: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
