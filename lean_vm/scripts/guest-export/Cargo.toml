# The aggregation guest of leanVM as Lean data, for `lean_vm/LeanVM/Guest/Data/` (and the test
# programs, node vectors and guest-diff cases). leanVM at `../leanvm-rev` no longer carries the
# `LEANVM_WRITE_*` tests that wrote these, and `.leanvm/` is not ours to edit, so this crate
# compiles leanVM's `rec_aggregation` sources as its own (an overlay: `build.rs` copies them into
# `OUT_DIR` and appends one line declaring `aggregation::lean_export`, this crate's
# `src/export/`), which lets the exporters read the guest's private pieces (`placeholder_map`,
# `statement_digest`, the batching, the hint streams) exactly as the in-tree tests did.
#
# leanVM is the checkout `../../../leanvm-tree.sh` makes at `../../../.leanvm` (the commit in
# `../../../leanvm-rev`), as for `rust-verifier-cli`; `Cargo.lock` is that checkout's.
[package]
name = "leanvm-guest-export"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

# Its own workspace, not a member of leanVM's; leanVM's crates still inherit that one's settings.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "guest-export"
path = "src/main.rs"

[dependencies]
# rec_aggregation's own dependencies (crates/rec_aggregation/Cargo.toml), by path.
primitives = { path = "../../../.leanvm/crates/primitives" }
parallel = { path = "../../../.leanvm/crates/parallel" }
pcs = { path = "../../../.leanvm/crates/pcs" }
keccak_gkr = { path = "../../../.leanvm/crates/keccak_gkr" }
leanvm_core = { path = "../../../.leanvm/crates/leanvm_core" }
lean_compiler = { path = "../../../.leanvm/crates/lean_compiler" }
signatures = { path = "../../../.leanvm/crates/signatures", features = ["mock"] }
lean_da = { path = "../../../.leanvm/crates/lean_da" }
verifier = { path = "../../../.leanvm/crates/verifier" }
rand = "0.9"
bincode = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1.26"

[features]
default = ["signers-cache"]
# rec_aggregation's feature: the cached benchmark signers, for the guest-diff cases.
signers-cache = []

[profile.release]
lto = "thin"
codegen-units = 1
