# leanVM's proof wire encoding (`crates/fiat_shamir/src/wire.rs`, `Proof::to_bytes` and
# `Proof::from_bytes`) on byte files, so that `scripts/wire-diff.py` can set its results beside the
# Lean transcription's (`lake exe wire-diff`, `Proof.fromBytes` and `Proof.toBytes`).
#
# leanVM is the checkout `../../../leanvm-tree.sh` makes at `../../../.leanvm` (the commit in
# `../../../leanvm-rev`), as for `rust-verifier-cli`; `Cargo.lock` is that checkout's.
[package]
name = "leanvm-rust-wire"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, not a member of leanVM's, whose members still inherit that one's settings.
[workspace]

[dependencies]
fiat_shamir = { path = "../../../.leanvm/crates/fiat_shamir" }
primitives = { path = "../../../.leanvm/crates/primitives" }

[profile.release]
codegen-units = 1
