# The deployed Rust verifier (leanVM `crates/verifier`) on the Python verifier's four files.
# `leanvm` is a symbolic link to a leanVM source tree at the pin, made by build.sh; see README.md.
[package]
name = "leanvm-rust-verify"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace; the linked tree is its own workspace too, whose members inherit its settings.
[workspace]
exclude = ["leanvm"]

[dependencies]
verifier = { path = "leanvm/crates/verifier" }

[profile.release]
codegen-units = 1
