name = "leanerVM"
version = "0.1.0"
defaultTargets = ["LeanerVM"]
# The test driver is the test library, not an executable: an executable linking
# historical `Fintype BF64` instance enumerated `2^64` elements at startup (finding P3 in
# docs/roadmap/leanisa-status.md); the current field enumeration is proof-only. Tests are
# `#guard`s and `example`s checked while the library compiles.
testDriver = "LeanerVMTests"

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

# The signature schemes whose security leanVM's formal/xmss and formal/sphincs prove: Spec/Node.lean
# imports their Scheme modules, built here with this package's toolchain and dependencies, so
# they come first: a later requirement's versions take precedence.
[[require]]
name = "xmss-security"
path = "../xmss"

[[require]]
name = "sphincs-security"
path = "../sphincs"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "42fe4b268132a46604d40cc73f642a1995f26547"

# Root requirements select the reviewed current source revisions over inherited
# manifests. Mathlib stays on the matching Lean 4.34.1 release; see docs/dependencies.md.
[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "4dae3acff846125521b7b3998010885071746f16"

# Native probability carriers and the free monads used by Protocol oracle computations.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "afa6593f15e1e79ecb3cf22fc56191cecb452bb0"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

[[lean_lib]]
name = "LeanerVM"

[[lean_lib]]
# Tests deliberately load full module bodies for kernel evaluation and axiom inspection.
name = "LeanerVMTests"
srcDir = "tests"
allowNonModules = true

# The deployed verifier, compiled, on the four proof files of the Rust prover
# (cli/LeanvmVerify.lean; scripts/fuzz-verifier.py compares it with the Rust verifier).
# Not a default target; scripts/fuzz-verifier.py runs it against the Rust verifier.
[[lean_exe]]
name = "leanvm-verify"
root = "LeanvmVerify"
srcDir = "cli"

# The Rust vectors' costly checks, compiled (cli/NodeVectors.lean); CI runs it after `lake test`.
[[lean_exe]]
name = "node-vectors"
root = "NodeVectors"
srcDir = "cli"
