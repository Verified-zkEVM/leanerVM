name = "lean-sphincs-security"
version = "0.1.0"
defaultTargets = ["Sphincs", "FORS"]

[leanOptions]
warningAsError = true
# Every module of `FORS` carries the `[Params]` instance (the height, the layers, the FORS shape),
# which some of its declarations do not use.
weak.linter.unusedSectionVars = false

# The statement: definitions and end statements only (`Statement/`).
[[require]]
name = "statement"
path = "../Statement"

# The proofs shared by the projects: the random-permutation model's indifferentiability and
# transfers, the duplex lemma.
[[require]]
name = "common"
path = "../common"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "afa6593f15e1e79ecb3cf22fc56191cecb452bb0"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

# The bridge from upstream's model to the statement, and the end theorem.
[[lean_lib]]
name = "Sphincs"

[[lean_lib]]
name = "FORS"
# `FORS.lean` imports every module; `FORS/Axioms.lean` checks their axioms.
roots = ["FORS", "FORS.Axioms"]

# The crates' known answers (EthLib vectors, leanSPHINCS's KAT) against the statement's key
# generation, signer and verifier, compiled (cli/SignatureKat.lean); not a default target.
[[lean_exe]]
name = "signature-kat"
root = "SignatureKat"
srcDir = "cli"
