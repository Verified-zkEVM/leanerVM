name = "leanerVM"
version = "0.1.0"
defaultTargets = ["LeanerVM"]
# The test driver is the test library, not an executable: an executable linking
# `CompPoly.Fields.Binary.BF64.Impl` evaluates its `Fintype BF64` instance at startup and is
# killed enumerating `2^64` elements (finding P3 in docs/roadmap/leanisa-status.md). Tests are
# `#guard`s and `example`s checked while the library compiles.
testDriver = "LeanerVMTests"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "3468b38c8fd270f93f55a259220a8abc544e7437"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "93c9d1ef45be9f687214625d7857889cf2485504"

# ArkLib's package name is `Arklib` (its lakefile), so the `require` must use that spelling. Its
# own CompPoly requirement is the `v4.33.1` tag; the root pin above (`3468b38c`, needed for the
# binary fields) wins the Lake resolution, and ArkLib's CompPoly-facing modules are rebuilt
# against it. See docs/dependencies.md.
[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "dca90385fb40dd5eb8da9145da6348ed17f5cd8b"

[[lean_lib]]
name = "LeanerVM"

[[lean_lib]]
name = "LeanerVMTests"
srcDir = "tests"
