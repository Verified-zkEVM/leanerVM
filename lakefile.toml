name = "leanerVM"
version = "0.1.0"
defaultTargets = ["LeanerVM", "LeanerVMBench"]
# The test driver is the test library, not an executable: an executable linking
# historical `Fintype BF64` instance enumerated `2^64` elements at startup (finding P3 in
# docs/roadmap/leanisa-status.md); the current field enumeration is proof-only. Tests are
# `#guard`s and `example`s checked while the library compiles.
testDriver = "LeanerVMTests"

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "e28da34817c3775cfb935376acf5d416f555d64f"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "a985c76c845e1d69ab320831d535072fcadb7c76"

# Root requirements select the reviewed current source revisions over inherited
# manifests. Mathlib stays on the matching Lean 4.35.0 release; see docs/dependencies.md.
[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "011391e592df184540b4b52edc2c64ee300b00ab"

# Native probability carriers and the free monads used by Protocol oracle computations.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "fc54dd3d7691d6f5db7dc829e321a727f095bc2d"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "d3ec3a414c233203e2050ed0f33fae8647f57eb7"

[[lean_lib]]
name = "LeanerVM"

[[lean_lib]]
# Tests deliberately load full module bodies for kernel evaluation and axiom inspection.
name = "LeanerVMTests"
srcDir = "tests"
allowNonModules = true

[[lean_lib]]
# The benchmark source as a library, a default target: every build elaborates it without
# linking, so it cannot fall behind the APIs it times. Timing needs the executable below.
name = "LeanerVMBench"
srcDir = "bench"
allowNonModules = true

[[lean_exe]]
# Steady-state timings of compiled arithmetic, hashing and evaluation; see bench/README.md.
# Not a default target: linking it compiles every transitive module to C.
name = "leanervm-bench"
srcDir = "bench"
root = "LeanerVMBench"

[[lean_exe]]
# The executable verifier on the Rust proof fixture, compiled; see bench/README.md.
# Not a default target.
name = "leanervm-verify"
srcDir = "bench"
root = "LeanerVMVerify"

[[lean_exe]]
# The honest prover on the constraint statement tests' witness, compiled: writes and checks the
# test vectors; see bench/README.md. Not a default target.
name = "leanervm-prove"
srcDir = "bench"
root = "LeanerVMProve"

[[lean_exe]]
# Executions of compiled programs by the Rust executor, read and checked natively; the witness
# generator's end-to-end harness. See bench/README.md. Not a default target.
name = "leanervm-witgen"
srcDir = "bench"
root = "LeanerVMWitgen"
